<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高精度画像向き補正 & コード照合リネーマー (4枚並列高速版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    .img-preview {
      max-height: 200px;
      max-width: 100%;
      object-fit: contain;
      transition: transform 0.2s ease-in-out;
    }
    .details-drawer {
      transition: all 0.3s ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans flex flex-col">

  <!-- ヘッダー -->
  <header class="bg-indigo-700 text-white shadow-lg sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-2">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-indigo-600 rounded-lg">
          <i class="fa-solid fa-bolt text-xl text-amber-300"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold leading-tight">高精度画像向き補正 & コード照合リネーマー</h1>
          <p class="text-xs text-indigo-200">4枚並列超高速解析 ＆ 「毎日新聞」上側優先補正システム</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-xs bg-indigo-800 text-indigo-100 px-3 py-1 rounded-full border border-indigo-500/50">
          <i class="fa-solid fa-gauge-high text-amber-300 mr-1"></i>4枚並列爆速モード
        </span>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 grid grid-cols-1 lg:grid-cols-12 gap-6 pb-12">

    <!-- 左側設定・ファイル登録パネル (4列) -->
    <div class="lg:col-span-4 flex flex-col gap-5">
      
      <!-- 補正定義カード -->
      <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-sm font-bold text-slate-700 mb-2 flex items-center gap-2">
          <i class="fa-solid fa-compass text-indigo-600"></i>
          文字向き正対の判定基準
        </h2>
        <div class="bg-indigo-50/70 rounded-lg p-3 text-xs text-indigo-900 border border-indigo-100 space-y-1.5">
          <div class="flex items-start gap-1.5 font-bold text-indigo-950">
            <i class="fa-solid fa-star text-amber-500 mt-0.5"></i>
            <span>【最優先】「毎日新聞」が正立して画像の上側に来るよう回転</span>
          </div>
          <div class="flex items-start gap-1.5 font-semibold text-slate-700 pt-1 border-t border-indigo-100">
            <i class="fa-solid fa-check text-indigo-600 mt-0.5"></i>
            <span>【第2優先】最も大きい見出し/日付が上側に配置</span>
          </div>
        </div>
      </section>

      <!-- コード照合リスト入力 -->
      <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col gap-3">
        <div class="flex justify-between items-center">
          <h2 class="text-sm font-bold text-slate-700 flex items-center gap-2">
            <i class="fa-solid fa-list-check text-indigo-600"></i>
            照合用コードリスト（自動保存）
          </h2>
          <span id="codeCount" class="text-xs font-semibold px-2 py-0.5 bg-indigo-50 text-indigo-600 rounded border border-indigo-100">
            0 件
          </span>
        </div>
        <textarea id="codeListInput" rows="4" placeholder="例:&#10;ABC-1001&#10;ABC-1002&#10;XYZ-9981" class="w-full text-xs p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none custom-scrollbar font-mono"></textarea>
        <div class="flex justify-between items-center text-[11px] text-slate-400">
          <span id="saveNotice" class="text-emerald-600 hidden"><i class="fa-solid fa-check mr-1"></i>保存完了</span>
          <button type="button" id="btnClearCodes" class="text-rose-500 hover:underline ml-auto">リスト全削除</button>
        </div>
      </section>

      <!-- ドロップゾーン / アップロード -->
      <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col gap-3">
        <h2 class="text-sm font-bold text-slate-700 flex items-center gap-2">
          <i class="fa-solid fa-images text-indigo-600"></i>
          画像ファイル追加
        </h2>
        
        <input type="file" id="fileInput" multiple accept="image/*,.png,.jpg,.jpeg,.webp,.bmp" class="hidden">

        <button type="button" id="btnSelectFiles" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-md transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-folder-open text-sm"></i>
          画像ファイルを選択（複数可）
        </button>

        <div id="dropZone" class="border-2 border-dashed border-slate-300 hover:border-indigo-400 bg-slate-50 transition rounded-xl p-3 text-center select-none flex flex-col items-center gap-1 cursor-pointer">
          <i class="fa-solid fa-cloud-arrow-up text-xl text-slate-400"></i>
          <span class="text-xs font-medium text-slate-600">ドラッグ＆ドロップでも追加可能</span>
        </div>

        <button type="button" id="btnClearAll" class="w-full py-1.5 text-xs font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition">
          全画像をクリア
        </button>
      </section>

      <!-- 一括処理コントロール -->
      <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col gap-3">
        <button type="button" id="btnProcessAll" disabled class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white font-bold text-sm rounded-xl shadow-md transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-bolt text-amber-300"></i>
          4枚並列処理をスタート
        </button>
        <button type="button" id="btnDownloadZip" disabled class="btn-download-zip w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-200 disabled:text-slate-400 text-white font-bold text-xs rounded-xl shadow-sm transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-file-zipper"></i>
          補正＆リネーム完了画像をZIP保存
        </button>
      </section>

    </div>

    <!-- 右側結果・プレビューエリア (8列) -->
    <div class="lg:col-span-8 flex flex-col gap-4">
      
      <!-- ステータスバー -->
      <div class="bg-white px-4 py-3 rounded-xl shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-3">
        <div class="flex items-center gap-4 text-xs">
          <span class="font-bold text-slate-700">全画像: <span id="statTotal" class="text-indigo-600 font-extrabold">0</span> 件</span>
          <span class="text-slate-400">|</span>
          <span class="text-slate-600">補正済: <span id="statSuccess" class="text-emerald-600 font-bold">0</span></span>
          <span class="text-slate-400">|</span>
          <span class="text-slate-600">未照合: <span id="statUnmatched" class="text-amber-600 font-bold">0</span></span>
        </div>

        <!-- プログレス表示 -->
        <div id="progressBox" class="hidden flex items-center gap-2 text-xs text-indigo-600 font-bold">
          <i class="fa-solid fa-circle-notch fa-spin"></i>
          <span id="progressText">4枚並列で解析中... (0/0)</span>
        </div>
      </div>

      <!-- 画像カードリスト -->
      <div id="imageList" class="flex flex-col gap-4">
        <!-- 未追加メッセージ -->
        <div id="emptyListNotice" class="bg-white p-12 rounded-xl border border-slate-200 text-center flex flex-col items-center gap-3">
          <i class="fa-regular fa-images text-4xl text-slate-300"></i>
          <p class="text-sm font-medium text-slate-500">画像ファイルを追加してください</p>
        </div>
      </div>

      <!-- 一番下のZIP保存ボタン（追加エリア） -->
      <div id="bottomDownloadContainer" class="hidden mt-4 pt-4 border-t border-slate-200">
        <button type="button" id="btnDownloadZipBottom" class="btn-download-zip w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-200 disabled:text-slate-400 text-white font-bold text-sm rounded-xl shadow-md transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-file-zipper text-lg"></i>
          補正＆リネーム完了画像をZIP保存 (一番下)
        </button>
      </div>

    </div>

  </main>

  <script>
    // API Key setting
    const apiKey = ""; // API Key provided at runtime

    // アプリ内状態
    let fileItems = []; // { id, originalName, newName, angle, matchedCode, reason, topElement, status, base64Data, displayUrl }
    let validCodes = [];

    // DOM要素
    const btnSelectFiles = document.getElementById('btnSelectFiles');
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const codeListInput = document.getElementById('codeListInput');
    const codeCount = document.getElementById('codeCount');
    const btnClearCodes = document.getElementById('btnClearCodes');
    const saveNotice = document.getElementById('saveNotice');
    
    const imageList = document.getElementById('imageList');
    const emptyListNotice = document.getElementById('emptyListNotice');

    const btnProcessAll = document.getElementById('btnProcessAll');
    const btnDownloadZipList = document.querySelectorAll('.btn-download-zip');
    const btnClearAll = document.getElementById('btnClearAll');
    const bottomDownloadContainer = document.getElementById('bottomDownloadContainer');

    const statTotal = document.getElementById('statTotal');
    const statSuccess = document.getElementById('statSuccess');
    const statUnmatched = document.getElementById('statUnmatched');
    const progressBox = document.getElementById('progressBox');
    const progressText = document.getElementById('progressText');

    // 初期化：ローカルストレージ復元
    window.addEventListener('DOMContentLoaded', () => {
      try {
        const savedCodes = localStorage.getItem('app_saved_code_list');
        if (savedCodes) {
          codeListInput.value = savedCodes;
          updateValidCodes();
        }
      } catch (e) {
        console.warn('LocalStorage error:', e);
      }
    });

    // コードリスト保存処理
    function updateValidCodes() {
      const text = codeListInput.value.trim();
      validCodes = text ? text.split('\n').map(c => c.trim()).filter(c => c.length > 0) : [];
      codeCount.textContent = `${validCodes.length} 件`;

      try {
        localStorage.setItem('app_saved_code_list', codeListInput.value);
        showSaveNotice();
      } catch (e) {
        console.warn('LocalStorage error:', e);
      }
    }

    let saveTimer;
    function showSaveNotice() {
      saveNotice.classList.remove('hidden');
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        saveNotice.classList.add('hidden');
      }, 1500);
    }

    codeListInput.addEventListener('input', updateValidCodes);

    btnClearCodes.addEventListener('click', () => {
      if (confirm('保存されたコードリストを全削除しますか？')) {
        codeListInput.value = '';
        updateValidCodes();
      }
    });

    // ファイル選択起動
    btnSelectFiles.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', async (e) => {
      if (e.target.files && e.target.files.length > 0) {
        await handleFiles(e.target.files);
        fileInput.value = '';
      }
    });

    // ドラッグ＆ドロップイベント
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.stopPropagation();
      dropZone.classList.add('border-indigo-500', 'bg-indigo-50');
    });

    dropZone.addEventListener('dragleave', (e) => {
      e.preventDefault();
      e.stopPropagation();
      dropZone.classList.remove('border-indigo-500', 'bg-indigo-50');
    });

    dropZone.addEventListener('drop', async (e) => {
      e.preventDefault();
      e.stopPropagation();
      dropZone.classList.remove('border-indigo-500', 'bg-indigo-50');
      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        await handleFiles(e.dataTransfer.files);
      }
    });

    btnClearAll.addEventListener('click', () => {
      if (fileItems.length === 0 || confirm('選択された全画像をクリアしますか？')) {
        fileItems = [];
        renderList();
      }
    });

    // 画像読み込み＆軽量化
    async function handleFiles(files) {
      const fileArray = Array.from(files);
      btnSelectFiles.disabled = true;
      btnSelectFiles.innerText = "読み込み中...";

      for (const file of fileArray) {
        const isImage = file.type?.startsWith('image/') || /\.(jpg|jpeg|png|webp|bmp|gif)$/i.test(file.name);
        if (!isImage) continue;

        try {
          const resized = await resizeImageFile(file, 640, 0.65);
          const id = 'img_' + Math.random().toString(36).substr(2, 9);

          fileItems.push({
            id,
            originalName: file.name,
            newName: file.name,
            angle: 0,
            matchedCode: null,
            reason: '未処理',
            topElement: '-',
            status: 'idle',
            base64Data: resized.base64,
            displayUrl: resized.dataUrl
          });
        } catch (err) {
          console.error("画像読み込み・軽量化失敗:", file.name, err);
        }
      }

      btnSelectFiles.disabled = false;
      btnSelectFiles.innerHTML = `<i class="fa-solid fa-folder-open text-sm"></i> パソコン・端末から画像を選択`;
      renderList();
    }

    // リサイズ処理
    function resizeImageFile(file, maxDimension = 640, quality = 0.65) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let width = img.width;
            let height = img.height;

            if (width > maxDimension || height > maxDimension) {
              if (width > height) {
                height = Math.round((height * maxDimension) / width);
                width = maxDimension;
              } else {
                width = Math.round((width * maxDimension) / height);
                height = maxDimension;
              }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const dataUrl = canvas.toDataURL('image/jpeg', quality);
            const base64 = dataUrl.split(',')[1];

            resolve({ dataUrl, base64 });
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // UIカード描画（コンパクト＆アコーディオン開閉対応）
    function renderList() {
      if (fileItems.length === 0) {
        emptyListNotice.classList.remove('hidden');
        imageList.innerHTML = '';
        imageList.appendChild(emptyListNotice);
        bottomDownloadContainer.classList.add('hidden');
        btnProcessAll.disabled = true;
        setZipButtonsState(true);
        updateStats();
        return;
      }

      emptyListNotice.classList.add('hidden');
      bottomDownloadContainer.classList.remove('hidden');
      btnProcessAll.disabled = false;
      
      imageList.innerHTML = '';

      fileItems.forEach((item) => {
        const card = document.createElement('div');
        card.className = "bg-white rounded-xl border border-slate-200 shadow-sm flex flex-col overflow-hidden transition hover:border-slate-300";

        card.innerHTML = `
          <!-- コンパクト表示ヘッダー部分 (常に表示) -->
          <div class="p-3.5 flex flex-wrap md:flex-nowrap items-center justify-between gap-3 bg-white">
            
            <!-- サムネイル ＋ 簡易状態 -->
            <div class="flex items-center gap-3">
              <div class="w-16 h-16 bg-slate-900 rounded-lg flex items-center justify-center overflow-hidden flex-shrink-0 relative">
                <img id="img_elem_${item.id}" src="${item.displayUrl}" class="img-preview max-h-full max-w-full object-contain" style="transform: rotate(${item.angle}deg);" alt="preview">
              </div>

              <div>
                <div class="flex items-center gap-2">
                  <span class="font-bold text-sm text-indigo-600 font-mono" id="summary_name_${item.id}">
                    ${escapeHtml(item.newName)}
                  </span>
                  ${item.matchedCode ? '<span class="text-[10px] bg-emerald-100 text-emerald-700 font-bold px-1.5 py-0.5 rounded">照合一致</span>' : ''}
                </div>
                <div class="text-xs text-slate-500 mt-0.5 flex items-center gap-2">
                  <span>回転: <strong id="deg_${item.id}" class="text-slate-800">${item.angle}°</strong></span>
                  <span>|</span>
                  <span class="truncate max-w-[150px] sm:max-w-[200px]" id="summary_top_${item.id}">検出: ${escapeHtml(item.topElement)}</span>
                </div>
              </div>
            </div>

            <!-- 右側アクションボタン -->
            <div class="flex items-center gap-2 ml-auto">
              <!-- 回転ボタン -->
              <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-lg">
                <button type="button" onclick="rotateManual('${item.id}', -90); event.stopPropagation();" class="w-7 h-7 bg-white hover:bg-slate-200 text-slate-700 rounded flex items-center justify-center text-xs shadow-sm transition" title="左へ90度回転">
                  <i class="fa-solid fa-rotate-left"></i>
                </button>
                <button type="button" onclick="rotateManual('${item.id}', 90); event.stopPropagation();" class="w-7 h-7 bg-white hover:bg-slate-200 text-slate-700 rounded flex items-center justify-center text-xs shadow-sm transition" title="右へ90度回転">
                  <i class="fa-solid fa-rotate-right"></i>
                </button>
              </div>

              <!-- トグル（開閉）ボタン -->
              <button type="button" onclick="toggleDetails('${item.id}')" class="px-2.5 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-bold rounded-lg transition flex items-center gap-1">
                <span id="toggle_text_${item.id}">詳細</span>
                <i id="toggle_icon_${item.id}" class="fa-solid fa-chevron-down text-[10px]"></i>
              </button>

              <!-- 削除ボタン -->
              <button type="button" onclick="removeItem('${item.id}')" class="w-8 h-8 text-slate-400 hover:text-rose-500 hover:bg-rose-50 rounded-lg text-xs transition flex items-center justify-center">
                <i class="fa-solid fa-xmark text-sm"></i>
              </button>
            </div>

          </div>

          <!-- 隠し詳細パネル (トグルで表示) -->
          <div id="details_${item.id}" class="details-drawer hidden border-t border-slate-100 bg-slate-50/70 p-4 text-xs space-y-3">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              <div>
                <span class="text-[10px] font-bold text-slate-400 uppercase block">元ファイル名</span>
                <span class="font-medium text-slate-700 break-all">${escapeHtml(item.originalName)}</span>
              </div>
              <div>
                <span class="text-[10px] font-bold text-slate-400 uppercase block">変更後ファイル名</span>
                <span class="font-bold text-indigo-600 font-mono break-all" id="detail_name_${item.id}">${escapeHtml(item.newName)}</span>
              </div>
            </div>

            <div class="bg-white p-2.5 rounded-lg border border-slate-200/60">
              <span class="text-[10px] font-bold text-slate-400 uppercase block mb-0.5">【補正情報】</span>
              <div class="flex flex-wrap gap-x-4 gap-y-1 text-slate-700">
                <span>適用回転角: <strong class="text-slate-900" id="detail_deg_${item.id}">${item.angle}°</strong></span>
                <span>上部検出要素: <strong class="text-slate-900" id="detail_top_${item.id}">${escapeHtml(item.topElement)}</strong></span>
              </div>
            </div>

            <div class="bg-amber-50/80 p-2.5 rounded-lg border border-amber-100 text-slate-600">
              <span class="font-bold text-amber-900 block mb-0.5">判定理由:</span>
              <p id="reason_${item.id}" class="leading-relaxed">${escapeHtml(item.reason)}</p>
            </div>
          </div>
        `;

        imageList.appendChild(card);
      });

      updateStats();
    }

    // アコーディオン開閉トグル
    window.toggleDetails = function(id) {
      const drawer = document.getElementById(`details_${id}`);
      const textElem = document.getElementById(`toggle_text_${id}`);
      const iconElem = document.getElementById(`toggle_icon_${id}`);

      if (!drawer) return;

      if (drawer.classList.contains('hidden')) {
        drawer.classList.remove('hidden');
        if (textElem) textElem.textContent = '閉じる';
        if (iconElem) iconElem.className = 'fa-solid fa-chevron-up text-[10px]';
      } else {
        drawer.classList.add('hidden');
        if (textElem) textElem.textContent = '詳細';
        if (iconElem) iconElem.className = 'fa-solid fa-chevron-down text-[10px]';
      }
    };

    // エスケープ
    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    // 手動回転
    window.rotateManual = function(id, deg) {
      const item = fileItems.find(i => i.id === id);
      if (!item) return;

      item.angle = (item.angle + deg + 360) % 360;
      
      const degElem = document.getElementById(`deg_${id}`);
      const detailDegElem = document.getElementById(`detail_deg_${id}`);
      if (degElem) degElem.textContent = `${item.angle}°`;
      if (detailDegElem) detailDegElem.textContent = `${item.angle}°`;

      const imgElem = document.getElementById(`img_elem_${id}`);
      if (imgElem) imgElem.style.transform = `rotate(${item.angle}deg)`;
    };

    // 削除
    window.removeItem = function(id) {
      fileItems = fileItems.filter(i => i.id !== id);
      renderList();
    };

    // ZIPボタン状態の一括セット
    function setZipButtonsState(disabled) {
      btnDownloadZipList.forEach(btn => {
        btn.disabled = disabled;
      });
    }

    // 統計更新
    function updateStats() {
      statTotal.textContent = fileItems.length;
      const doneCount = fileItems.filter(i => i.status === 'done').length;
      const unmatchedCount = fileItems.filter(i => i.status === 'done' && !i.matchedCode).length;

      statSuccess.textContent = doneCount;
      statUnmatched.textContent = unmatchedCount;

      setZipButtonsState(doneCount === 0);
    }

    // Gemini API 呼び出し（Exponential Backoff）
    async function callGeminiApiWithRetry(payload, maxRetries = 5) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
      let delay = 800;

      for (let i = 0; i < maxRetries; i++) {
        try {
          const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (response.ok) {
            return await response.json();
          }
        } catch (err) {
          // リトライ
        }
        await new Promise(res => setTimeout(res, delay));
        delay *= 1.5;
      }
      throw new Error('API通信エラーが発生しました。');
    }

    // 4枚並列一括処理
    btnProcessAll.addEventListener('click', async () => {
      if (fileItems.length === 0) return;

      btnProcessAll.disabled = true;
      progressBox.classList.remove('hidden');

      const concurrencyLimit = 4; // 4枚同時並行解析
      let processedCount = 0;
      const total = fileItems.length;

      const queue = [...fileItems];
      const activePromises = [];

      const worker = async () => {
        while (queue.length > 0) {
          const item = queue.shift();
          try {
            await processSingleItem(item);
          } catch (err) {
            console.error("解析エラー:", err);
            item.status = 'error';
            item.reason = '解析失敗: ' + (err.message || '');
            const reasonElem = document.getElementById(`reason_${item.id}`);
            if (reasonElem) reasonElem.textContent = item.reason;
          }
          processedCount++;
          progressText.textContent = `4枚並列で解析中... (${processedCount}/${total})`;
          updateStats();
        }
      };

      for (let i = 0; i < Math.min(concurrencyLimit, total); i++) {
        activePromises.push(worker());
      }

      await Promise.all(activePromises);

      progressBox.classList.add('hidden');
      btnProcessAll.disabled = false;
    });

    // 個別画像解析
    async function processSingleItem(item) {
      if (!item.base64Data) throw new Error("画像データがありません");

      const prompt = `
画像から回転角度(0,90,180,270)とIDコードを判定してください。

【1. 回転角度判定】
- 最優先: 「毎日新聞」の文字が存在する場合、その文字が水平に正立し、画像全体の【上側（上半分）】に配置される回転角度(0, 90, 180, 270)を選択。※下側にある場合は必ず180度反転。
- 第2優先: 「毎日新聞」がない場合、一番大きい見出しまたは日付が【上側】に来る角度。

【2. コード照合】
画像からIDコードを抽出し、以下のリストで一致するものを指定。
照合リスト:
${validCodes.length > 0 ? validCodes.join('\n') : 'なし'}

JSON出力フォーマット:
{
  "rotateCW": 0,
  "topElementFound": "上側の文字（毎日新聞など）",
  "matchedCode": "一致したコード（無ければnull）",
  "extractedText": "読み取ったID",
  "reason": "判定理由（簡潔に）"
}
`;

      const payload = {
        contents: [{
          role: "user",
          parts: [
            { text: prompt },
            {
              inlineData: {
                mimeType: "image/jpeg",
                data: item.base64Data
              }
            }
          ]
        }],
        generationConfig: {
          responseMimeType: "application/json",
          responseSchema: {
            type: "OBJECT",
            properties: {
              rotateCW: { type: "INTEGER" },
              topElementFound: { type: "STRING" },
              matchedCode: { type: "STRING" },
              extractedText: { type: "STRING" },
              reason: { type: "STRING" }
            },
            required: ["rotateCW", "topElementFound", "reason"]
          }
        }
      };

      const result = await callGeminiApiWithRetry(payload);
      const text = result.candidates?.[0]?.content?.parts?.[0]?.text;

      if (!text) throw new Error('応答がありません');

      const parsed = JSON.parse(text);

      // 補正角度適用
      const addAngle = parsed.rotateCW || 0;
      item.angle = (item.angle + addAngle) % 360;
      item.topElement = parsed.topElementFound || '上部検出';
      item.reason = parsed.reason || '解析完了';
      item.matchedCode = parsed.matchedCode || null;
      item.status = 'done';

      // ファイル名判定
      const ext = item.originalName.includes('.') ? item.originalName.substring(item.originalName.lastIndexOf('.')) : '.jpg';
      if (item.matchedCode) {
        item.newName = `${item.matchedCode}${ext}`;
      } else if (parsed.extractedText) {
        item.newName = `${parsed.extractedText}_[要確認]${ext}`;
      } else {
        item.newName = `[未照合]_${item.originalName}`;
      }

      // UI反映 (サマリー＆詳細両方に反映)
      const degElem = document.getElementById(`deg_${item.id}`);
      const detailDegElem = document.getElementById(`detail_deg_${item.id}`);
      const summaryTopElem = document.getElementById(`summary_top_${item.id}`);
      const detailTopElem = document.getElementById(`detail_top_${item.id}`);
      const summaryNameElem = document.getElementById(`summary_name_${item.id}`);
      const detailNameElem = document.getElementById(`detail_name_${item.id}`);
      const reasonElem = document.getElementById(`reason_${item.id}`);
      const imgElem = document.getElementById(`img_elem_${item.id}`);

      if (degElem) degElem.textContent = `${item.angle}°`;
      if (detailDegElem) detailDegElem.textContent = `${item.angle}°`;
      if (summaryTopElem) summaryTopElem.textContent = `検出: ${item.topElement}`;
      if (detailTopElem) detailTopElem.textContent = item.topElement;
      if (summaryNameElem) summaryNameElem.textContent = item.newName;
      if (detailNameElem) detailNameElem.textContent = item.newName;
      if (reasonElem) reasonElem.textContent = item.reason;
      if (imgElem) imgElem.style.transform = `rotate(${item.angle}deg)`;
    }

    // ZIP出力用
    function getRotatedBase64(item) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const angle = (item.angle % 360 + 360) % 360;
          const is90 = (angle === 90 || angle === 270);
          const w = is90 ? img.height : img.width;
          const h = is90 ? img.width : img.height;

          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');

          ctx.translate(w / 2, h / 2);
          ctx.rotate((angle * Math.PI) / 180);
          ctx.drawImage(img, -img.width / 2, -img.height / 2);

          const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
          resolve(dataUrl.split(',')[1]);
        };
        img.src = item.displayUrl;
      });
    }

    // ZIPダウンロード実行（上部・下部ボタン共通イベントハンドラ）
    btnDownloadZipList.forEach(btn => {
      btn.addEventListener('click', async () => {
        const doneItems = fileItems.filter(i => i.status === 'done');
        if (doneItems.length === 0) return;

        btnDownloadZipList.forEach(b => {
          b.disabled = true;
          b.innerText = "ZIP生成中...";
        });

        const zip = new JSZip();

        for (const item of doneItems) {
          try {
            const base64 = await getRotatedBase64(item);
            zip.file(item.newName, base64, { base64: true });
          } catch (e) {
            console.error("ZIP追加エラー:", e);
          }
        }

        const blob = await zip.generateAsync({ type: 'blob' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'corrected_renamed_images.zip';
        a.click();
        URL.revokeObjectURL(url);

        btnDownloadZipList.forEach(b => {
          b.disabled = false;
          b.innerHTML = `<i class="fa-solid fa-file-zipper"></i> 補正＆リネーム完了画像をZIP保存`;
        });
      });
    });
  </script>
</body>
</html>
